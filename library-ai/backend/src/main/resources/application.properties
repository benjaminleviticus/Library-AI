# Spring application
spring.application.name=library-app

# ---------------------------
# File upload settings
# ---------------------------
app.upload-dir=uploads
app.base-url=${APP_BASE_URL:http://localhost:8081}


# ---------------------------
# Database Configuration
# ---------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------
# Connection Pool (HikariCP)
# ---------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=-1

# ---------------------------
# JPA / Hibernate
# ---------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------------------------
# SQL initialization
# ---------------------------
spring.sql.init.mode=never
# ---------------------------
# Server port
# ---------------------------
server.port=8081

# ---------------------------
# Uploads (PDF books)
# ---------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# ---------------------------
# Logging (quiet by default; use the "dev" profile for verbose SQL/security logs)
# ---------------------------
logging.level.root=INFO

# Custom UserDetailsService is defined in SecurityConfig
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
